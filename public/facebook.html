<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Facebook Video Downloader</title>

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
}

/* NAVBAR */
.navbar{
display:flex;
justify-content:center;
gap:20px;
background:#020617;
padding:15px;
}

.navbar a{
color:white;
text-decoration:none;
padding:10px 15px;
border-radius:8px;
display:flex;
align-items:center;
gap:8px;
transition:0.3s;
}

.navbar a:hover{
background:#1e293b;
}

/* MAIN */
.main{
display:flex;
justify-content:center;
align-items:center;
height:90vh;
}

.container{
background:#1e293b;
padding:30px;
border-radius:12px;
width:420px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

h2{
margin-bottom:20px;
color:#1877f2;
}

input{
width:95%;
padding:12px;
border:none;
border-radius:8px;
outline:none;
}

button{
margin-top:15px;
padding:12px 20px;
background:#1877f2;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
font-size:15px;
transition:0.3s;
}

button:hover{
background:#3b8cff;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

<a href="index.html">
<i class="fab fa-instagram"></i> Instagram
</a>

<a href="facebook.html">
<i class="fab fa-facebook"></i> Facebook
</a>

<a href="pinterest.html">
<i class="fab fa-pinterest"></i> Pinterest
</a>

<a href="tiktok.html">
<i class="fab fa-tiktok"></i> TikTok
</a>

<a href="twitter.html">
<i class="fab fa-twitter"></i> Twitter
</a>

</div>

<!-- CONTENT -->
<div class="main">

<div class="container">

<h2><i class="fab fa-facebook"></i> Facebook Video Downloader</h2>

<input id="url" placeholder="Paste Facebook Video Link">

<br>

<button onclick="download()">Download</button>

</div>

</div>

<script>

function download(){

let url=document.getElementById("url").value

if(!url){
alert("Please enter Facebook URL")
return
}

window.open(`https://download-fc72.onrender.com/download?url=${encodeURIComponent(url)}`)

}

</script>

</body>
</html>
