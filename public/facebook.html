<script>
async function pasteText(){
  try{
    const text = await navigator.clipboard.readText()
    document.getElementById("url").value = text
  }catch(err){
    alert("Paste not allowed")
  }
}

function isValidFacebook(url){
  return url.includes("facebook.com") || url.includes("fb.watch")
}

function download(){
  let url=document.getElementById("url").value
  let error=document.getElementById("error")

  error.innerText=""

  if(!url){
    error.innerText="Please enter Facebook URL"
    return
  }

  if(!isValidFacebook(url)){
    error.innerText="Enter valid Facebook link"
    return
  }

  window.open(`https://download-fc72.onrender.com/download?url=${encodeURIComponent(url)}`)
}
